# To upload the docs with CLI:
# curl -X POST "http://server_ip:9000/upload/document" \
#     -H "accept: application/json" \
#     -H "Content-Type: multipart/form-data" \
#     -F "file=@/path/to/your/document.pdf" \
#     -F "folder=your/folder/path"
# And then trigger the processing:
# curl -X POST "http://server_ip:9000/process/documents"

## General commands:
# Remove all containers
# sudo docker rm -f $(docker ps -a -q)
# Remove all:
# sudo docker system prune --all --volumes --force
# Get the  last 100 lines of logs:
# docker logs atlantium_llm-web-app-1 -f --tail=100

### Normal Operation Sequence:
# git clone https://github.com/kertser/Atlantium_LLM.git
# cd Atlantium_LLM
# cp .env.example .env
# sudo chmod +x deploy.sh
# sudo ./deploy.sh --init
# The web app will be available at http://server_ip:9000

version: '3.8'

services:
  web-app-gpu:
    container_name: ${CONTAINER_NAME:-atlantium_llm-web-app-1}
    environment:
      - PYTHONIOENCODING=utf-8
      - USE_CPU=0
      - INITIALIZE_RAG=${INITIALIZE_RAG:-false}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_TYPE=gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "9000:9000"
    volumes:
      - type: bind
        source: ./Raw Documents
        target: /app/Raw Documents
      - type: bind
        source: ./RAG_Data
        target: /app/RAG_Data
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${HOME}/.docker/config.json
        target: /root/.docker/config.json
        read_only: true
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - gpu

  web-app-cpu:
    container_name: ${CONTAINER_NAME:-atlantium_llm-web-app-1}
    environment:
      - PYTHONIOENCODING=utf-8
      - USE_CPU=1
      - INITIALIZE_RAG=${INITIALIZE_RAG:-false}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_TYPE=cpu
    ports:
      - "9000:9000"
    volumes:
      - type: bind
        source: ./Raw Documents
        target: /app/Raw Documents
      - type: bind
        source: ./RAG_Data
        target: /app/RAG_Data
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${HOME}/.docker/config.json
        target: /root/.docker/config.json
        read_only: true
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - cpu