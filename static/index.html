<!DOCTYPE html>
<html lang="en">
<head>
    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            },
        };
    </script>
    <!-- Load MathJax -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
    <meta charset="UTF-8">
    <meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control">
    <meta content="no-cache" http-equiv="Pragma">
    <meta content="0" http-equiv="Expires">

    <title>Atlantium Technical Documentation Assistant</title>
    <link href="/static/styles.css?v=1.0.0" rel="stylesheet">
    <link href="/favicon.png?v=1.0.0" rel="icon" type="image/png">


</head>
<body>
<div class="app-container">
    <div class="image-container">
        <a href="https://www.atlantium.com" target="_blank"><img alt="Top Image" src="/static/logo_long.jpg"
                                                                 style="width: 100%; height: auto;"></a>
    </div>

    <div id="chat-container">
        <div id="chat-log"></div>
    </div>

    <div id="input-container">
        <div class="input-wrapper">
            <div class="attached-image-preview" style="display: none;"></div>
            <textarea placeholder="Type your message..."></textarea>
        </div>
        <div class="button-group">
            <button id="send-button">Send</button>
            <button id="send-image">Attach Image</button>
            <button id="reset-button">Reset</button>
        </div>
    </div>

    <div class="upload-container" id="document-upload">
        <h2>Upload Documents to Retrieval System</h2>
        <div class="upload-box" id="drop-zone">
            <input accept=".pdf,.docx,.xlsx" id="file-input" maxlength="10" multiple style="display: none;" type="file">
            <div class="upload-content">
                <svg class="upload-icon" height="24" viewBox="0 0 24 24" width="24">
                    <path d="M11 15h2V6h3l-4-4-4 4h3v9zm0 4h2v-2h-2v2zm8-2v2H5v-2H3v4h18v-4h-2z" fill="currentColor"/>
                </svg>
                <p>Drag and drop files or click to upload</p>
                <p class="supported-formats">Supported formats: PDF, DOCX, XLSX</p>
            </div>
        </div>
        <button class="process-btn" id="process-documents" style="display: none;">
            <span class="button-text">Process Documents</span>
                <span class="progress-container">
                    <span class="progress-bar"></span>
                </span>
        </button>
        <div id="upload-list"></div>
    </div>

    <div class="documents-container" id="documents-list">
        <div class="documents-header">
            <div class="documents-title">
                <h2>Indexed Reference Documents</h2>
            </div>
            <div class="document-stats-actions">
                <div class="document-stats" id="doc-count">Total: 0</div>
                <div class="document-actions">
                    <!-- Batch actions div -->
                    <div class="batch-actions">
                        <button class="icon-button" id="batch-delete-button" title="Delete selected items">
                            <svg height="16" viewBox="0 0 24 24" width="16">
                                <path d="M7 4V2h10v2h5v2h-2v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6H2V4h5zM6 6v14h12V6H6z"
                                      fill="currentColor"/>
                            </svg>
                            Delete Selected (<span class="selected-count">0</span>)
                        </button>
                    </div>
                    <!-- Regular action buttons -->
                    <button class="icon-button" id="rescan-button" title="Rescan for new documents">
                        <svg height="16" viewBox="0 0 24 24" width="16">
                            <path d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                                  fill="currentColor"/>
                        </svg>
                        Rescan
                    </button>
                    <button class="icon-button" id="new-folder-button" title="Create new folder">
                        <svg height="16" viewBox="0 0 24 24" width="16">
                            <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"
                                  fill="currentColor"/>
                        </svg>
                        New Folder
                    </button>
                </div>
            </div>
        </div>
        <div class="documents-table-wrapper">
            <!-- Everything will be populated by JavaScript -->
        </div>
    </div>
</div>
<!-- Modal template -->
<div id="modal-template" style="display: none;">
    <div class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3></h3>
            </div>
            <div class="modal-body">
            </div>
            <div class="modal-footer">
                <button class="icon-button" data-action="cancel">Cancel</button>
                <button class="icon-button" data-action="confirm">Confirm</button>
            </div>
        </div>
    </div>
</div>
<div>
    <footer class="developer-credits">
        <p>
            <span class="developer-label">Developed by:</span>
            <span class="developer-name">Mike Kertser</span>
            <span class="developer-year">2024</span>
        </p>
        <span class="version">v1.04</span>
    </footer>
</div>

<script src="/static/scripts.js?v=1.0.0"></script>
<a href="https://wa.me/972546490221" class="whatsapp-button" target="_blank" rel="noopener noreferrer">
    <svg class="whatsapp-icon" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 012.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.188 8.188 0 01-1.26-4.38c.01-4.54 3.7-8.24 8.25-8.24M8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.87.86-.87 2.07 0 1.22.89 2.39 1 2.56.14.17 1.76 2.67 4.25 3.73.59.27 1.05.42 1.41.53.59.19 1.13.16 1.56.1.48-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.16-.48-.27-.25-.14-1.47-.74-1.69-.82-.23-.08-.37-.12-.56.12-.16.25-.64.81-.78.97-.15.17-.29.19-.53.07-.26-.13-1.06-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.12-.24-.01-.39.11-.5.11-.11.27-.29.37-.44.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.11-.56-1.35-.77-1.84-.2-.48-.4-.42-.56-.43-.14 0-.3-.01-.47-.01z"/>
    </svg>
</a>
</body>
</html>
