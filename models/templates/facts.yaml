# Public Case Studies
case_studies:
  - industry: "Municipal"
    location: "Lunenburg, Massachusetts, USA"
    challenge: "Cryptosporidium inactivation and chlorine taste/odor issues"
    solution: "Installation of RZ300-11 HOD UV system"
    results: "Achieved 4-log reduction of Cryptosporidium and improved water taste and odor"

  - industry: "Industrial"
    location: "California, USA"
    challenge: "NDMA contamination in water supply"
    solution: "Implementation of HOD UV system"
    results: "Significant reduction in NDMA concentrations"

  - industry: "Aquaculture"
    location: "Palma, Spain"
    challenge: "Preventing disease outbreaks in marine ecosystems"
    solution: "Deployment of HOD UV technology"
    results: "Enhanced water biosecurity at Palma Aquarium"

  - industry: "Power Generation"
    location: "Pinghu, China"
    challenge: "Non-chemical boiler-feed make-up water disinfection"
    solution: "Installation of HOD UV system"
    results: "Effective RO membrane protection and reduced biofouling"

  - industry: "Food & Beverage"
    location: "Taiwan"
    challenge: "Microbial contamination in simple syrup"
    solution: "Integration of HOD UV system"
    results: "Significant reduction in microbial levels"

